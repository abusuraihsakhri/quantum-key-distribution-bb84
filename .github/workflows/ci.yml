name: BB84 tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      AUDIT_SECRET_KEY: test-audit-key-for-development-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[server,test]'
      - name: Check Python syntax
        run: python -m compileall -q agents qkd_bb84_engine cli.py enrichment.py simulator.py
      - name: Regression tests
        run: python -m pytest -q
      - name: Audit integrity check
        run: |
          python -c "from agents.base import AuditTrail; t=AuditTrail('test-key-strong-enough'); t.log('a','b','c',{'x':1}); assert t.verify_integrity(); t.logs[0]['event_type']='tampered'; assert not t.verify_integrity()"
      - name: Browser JavaScript syntax
        run: node --check web/app.js
