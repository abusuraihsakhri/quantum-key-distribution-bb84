[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-key-distribution-bb84"
version = "2.0.0"
description = "BB84 & E91 Quantum Key Distribution Simulation & Eavesdrop Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantum-key-distribution-bb84 = "qkd_bb84_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-key-distribution-bb84"
Repository = "https://github.com/abusuraihsakhri/quantum-key-distribution-bb84.git"
